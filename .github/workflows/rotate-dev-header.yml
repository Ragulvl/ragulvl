name: Rotate Dev Header

on:
  schedule:
    - cron: '0 0 * * *'   # daily at 00:00 UTC
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Choose header variant
        id: choose
        run: |
          variants=(
            "dev-header-1.svg"
            "dev-header-2.svg"
            "dev-header-3.svg"
          )
          idx=$((RANDOM % ${#variants[@]}))
          echo "variant=${variants[$idx]}" >> $GITHUB_OUTPUT

      - name: Copy selected header
        run: |
          SRC="assets/variants/${{ steps.choose.outputs.variant }}"
          DEST="assets/dev-header.svg"
          if [ -f "$SRC" ]; then
            cp "$SRC" "$DEST"
            git add "$DEST"
            git commit -m "chore(readme): rotate dev header to ${{ steps.choose.outputs.variant }}" || echo "no change"
            git push
          else
            echo "No variant file found; skipping commit."
          fi
