<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="44" viewBox="0 0 900 44">
  <!-- Background -->
  <rect width="900" height="44" rx="8" fill="#0a0e1a"/>
  <rect x="0.5" y="0.5" width="899" height="43" rx="8" fill="none" stroke="#1e293b" stroke-width="0.5"/>

  <!-- Left: system status -->
  <circle cx="24" cy="22" r="4" fill="#39ff14" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.4;0.9" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="36" y="26" font-family="'Fira Code','Cascadia Code',monospace" font-size="11" fill="#39ff14">SYSTEMS NOMINAL</text>

  <!-- Center: identity -->
  <text x="450" y="26" text-anchor="middle" font-family="'Fira Code','Cascadia Code',monospace" font-size="11">
    <tspan fill="#00f0ff">ragulvl</tspan>
    <tspan fill="#1e293b"> ◆ </tspan>
    <tspan fill="#ff00aa">github</tspan>
    <tspan fill="#64748b"> │ </tspan>
    <tspan fill="#64748b">2026</tspan>
  </text>

  <!-- Right: blinking cursor -->
  <text x="820" y="26" font-family="'Fira Code',monospace" font-size="11" fill="#64748b">CMD:</text>
  <rect x="856" y="14" width="9" height="16" rx="1" fill="#00f0ff" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
