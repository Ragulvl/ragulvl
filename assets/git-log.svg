<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240">
  <!-- Terminal background -->
  <rect width="900" height="240" fill="#0d1117" rx="8"/>
  <!-- Terminal header bar -->
  <rect width="900" height="30" fill="#161b22" rx="8"/>
  <rect x="0" y="22" width="900" height="8" fill="#161b22"/>
  <!-- Terminal dots -->
  <circle cx="18" cy="15" r="5" fill="#ff5f57"/>
  <circle cx="36" cy="15" r="5" fill="#febc2e"/>
  <circle cx="54" cy="15" r="5" fill="#28c840"/>
  <!-- Terminal title -->
  <text x="450" y="19" font-family="'SF Mono', 'Fira Code', monospace" font-size="12" fill="#8b949e" text-anchor="middle">ragul@dev: ~/projects</text>

  <!-- Git log content -->
  <g font-family="'Fira Code', 'Cascadia Code', 'JetBrains Mono', 'Consolas', monospace" font-size="14" transform="translate(24, 52)">

    <!-- $ git log command -->
    <text x="0" y="0">
      <tspan fill="#7ee787">❯ </tspan><tspan fill="#e6edf3">git log --oneline --graph</tspan>
    </text>

    <!-- Commit 1 (HEAD) -->
    <text x="0" y="36">
      <tspan fill="#58a6ff">* </tspan><tspan fill="#ffa657">a3f82c1 </tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#7ee787">HEAD</tspan><tspan fill="#e6edf3">) </tspan><tspan fill="#e6edf3">Dinez — Full-stack canteen ordering</tspan>
    </text>
    <text x="0" y="56">
      <tspan fill="#30363d">│         </tspan><tspan fill="#8b949e">React + Node.js + MySQL + Razorpay</tspan>
    </text>

    <!-- Commit 2 -->
    <text x="0" y="88">
      <tspan fill="#58a6ff">* </tspan><tspan fill="#ffa657">e7b91d4 </tspan><tspan fill="#e6edf3">Fusion Forge — Custom PC e-commerce</tspan>
    </text>
    <text x="0" y="108">
      <tspan fill="#30363d">│         </tspan><tspan fill="#8b949e">React + MySQL + Razorpay integration</tspan>
    </text>

    <!-- Commit 3 -->
    <text x="0" y="140">
      <tspan fill="#58a6ff">* </tspan><tspan fill="#ffa657">1c4a09f </tspan><tspan fill="#e6edf3">ML Pipelines — Data science experiments</tspan>
    </text>
    <text x="0" y="160">
      <tspan fill="#30363d">│         </tspan><tspan fill="#8b949e">scikit-learn + pandas + NumPy</tspan>
    </text>

  </g>
</svg>
