<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">
  <!-- Terminal background -->
  <rect width="900" height="200" fill="#0d1117" rx="8"/>
  <!-- Terminal header -->
  <rect width="900" height="30" fill="#161b22" rx="8"/>
  <rect x="0" y="22" width="900" height="8" fill="#161b22"/>
  <circle cx="18" cy="15" r="5" fill="#ff5f57"/>
  <circle cx="36" cy="15" r="5" fill="#febc2e"/>
  <circle cx="54" cy="15" r="5" fill="#28c840"/>
  <text x="450" y="19" font-family="'SF Mono', 'Fira Code', monospace" font-size="12" fill="#8b949e" text-anchor="middle">ragul@dev: ~</text>

  <!-- Terminal content -->
  <g font-family="'Fira Code', 'Cascadia Code', 'JetBrains Mono', 'Consolas', monospace" font-size="14" transform="translate(24, 52)">

    <!-- Command -->
    <text x="0" y="0">
      <tspan fill="#7ee787">❯ </tspan><tspan fill="#e6edf3">cat contact.yml</tspan>
    </text>

    <!-- Output -->
    <text x="0" y="32">
      <tspan fill="#58a6ff">github</tspan><tspan fill="#e6edf3">:   </tspan><tspan fill="#7ee787">github.com/Ragulvl</tspan>
    </text>
    <text x="0" y="56">
      <tspan fill="#58a6ff">linkedin</tspan><tspan fill="#e6edf3">: </tspan><tspan fill="#7ee787">linkedin.com/in/ragul-v-l-291143292</tspan>
    </text>
    <text x="0" y="80">
      <tspan fill="#58a6ff">email</tspan><tspan fill="#e6edf3">:    </tspan><tspan fill="#7ee787">ragulkamelash@gmail.com</tspan>
    </text>

    <!-- Second command -->
    <text x="0" y="116">
      <tspan fill="#7ee787">❯ </tspan><tspan fill="#e6edf3">echo </tspan><tspan fill="#7ee787">"Open to internships &amp; SDE roles"</tspan>
    </text>

    <!-- Blinking cursor -->
    <rect x="0" y="134" width="8" height="16" fill="#58a6ff">
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
