<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#07133a"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" x2="1">
      <stop offset="0%" stop-color="#00D4FF" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
  </defs>

  <rect width="1200" height="220" rx="8" fill="url(#g1)" />
  <!-- title -->
  <text x="60" y="80" font-family="monospace, monospace" font-size="42" fill="#E6EEF3" font-weight="700">Ragul V L</text>
  <text x="60" y="115" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, " font-size="16" fill="#9fb3c8">Engineer • AI &amp; Data Science • SDE aspirant</text>

  <!-- moving code lines -->
  <g transform="translate(60,135)">
    <rect x="0" y="0" width="540" height="44" rx="6" fill="#07112a" opacity="0.75"/>
    <g fill="#062737" stroke="none" transform="translate(12,8)">
      <!-- three pseudo code lines that subtly move -->
      <rect id="l1" x="0" y="0" width="420" height="6" rx="3" fill="#0ea5a7" opacity="0.9" />
      <rect id="l2" x="0" y="14" width="360" height="6" rx="3" fill="#3b82f6" opacity="0.9" />
      <rect id="l3" x="0" y="28" width="300" height="6" rx="3" fill="#7c3aed" opacity="0.9" />
    </g>
    <!-- animate widths in loop for a subtle code shimmer -->
    <animate href="#l1" attributeName="width" values="420;360;420" dur="6s" repeatCount="indefinite"/>
    <animate href="#l2" attributeName="width" values="360;300;360" dur="5s" repeatCount="indefinite"/>
    <animate href="#l3" attributeName="width" values="300;250;300" dur="4s" repeatCount="indefinite"/>
  </g>

  <!-- right side gradient bar (animated) -->
  <rect x="840" y="30" width="300" height="160" rx="6" fill="url(#g2)" opacity="0.12"/>
  <g transform="translate(840,30)">
    <rect x="0" y="0" width="300" height="160" rx="6" fill="none"/>
    <rect x="-300" y="0" width="300" height="160" rx="6" fill="url(#g2)" opacity="0.06">
      <animate attributeName="x" from="-300" to="300" dur="10s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
