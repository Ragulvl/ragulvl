<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180">
  <defs>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="180" rx="0" fill="#0d1117"/>

  <!-- thin accent line at top -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#accent)"/>

  <!-- left bracket -->
  <text x="50" y="105" font-family="'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace" font-size="72" fill="#1f6feb" opacity="0.25" font-weight="700">{</text>

  <!-- name -->
  <text x="120" y="85" font-family="'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace" font-size="44" fill="#e6edf3" font-weight="700" letter-spacing="2">Ragul V L</text>

  <!-- tagline -->
  <text x="120" y="120" font-family="'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace" font-size="16" fill="#8b949e" letter-spacing="1">Engineer  ·  AI &amp; Data Science  ·  Full-Stack Builder</text>

  <!-- right bracket -->
  <text x="1100" y="105" font-family="'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace" font-size="72" fill="#1f6feb" opacity="0.25" font-weight="700">}</text>

  <!-- thin accent line at bottom -->
  <rect x="120" y="140" width="960" height="1" fill="#21262d"/>
  <rect x="120" y="140" width="300" height="1" fill="url(#accent)" opacity="0.6"/>

  <!-- subtle dots pattern on the right -->
  <g fill="#21262d" opacity="0.4">
    <circle cx="900" cy="40" r="1.5"/>
    <circle cx="920" cy="40" r="1.5"/>
    <circle cx="940" cy="40" r="1.5"/>
    <circle cx="960" cy="40" r="1.5"/>
    <circle cx="980" cy="40" r="1.5"/>
    <circle cx="1000" cy="40" r="1.5"/>
    <circle cx="900" cy="55" r="1.5"/>
    <circle cx="920" cy="55" r="1.5"/>
    <circle cx="940" cy="55" r="1.5"/>
    <circle cx="960" cy="55" r="1.5"/>
    <circle cx="980" cy="55" r="1.5"/>
    <circle cx="1000" cy="55" r="1.5"/>
    <circle cx="900" cy="70" r="1.5"/>
    <circle cx="920" cy="70" r="1.5"/>
    <circle cx="940" cy="70" r="1.5"/>
    <circle cx="960" cy="70" r="1.5"/>
    <circle cx="980" cy="70" r="1.5"/>
    <circle cx="1000" cy="70" r="1.5"/>
  </g>
</svg>
