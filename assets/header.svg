<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="56" viewBox="0 0 900 56">
  <!-- Title bar background -->
  <rect width="900" height="32" fill="#1e1e1e"/>
  <!-- Tab bar background -->
  <rect y="32" width="900" height="24" fill="#252526"/>

  <!-- Traffic light dots -->
  <circle cx="20" cy="16" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="16" r="6" fill="#febc2e"/>
  <circle cx="60" cy="16" r="6" fill="#28c840"/>

  <!-- Window title -->
  <text x="450" y="20" font-family="'Segoe UI', 'SF Pro', system-ui, sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">ragul_vl.py — ~/projects/ragulvl</text>

  <!-- Active tab -->
  <rect x="0" y="32" width="160" height="24" fill="#0d1117"/>
  <rect x="0" y="32" width="160" height="2" fill="#58a6ff"/>
  <!-- Python icon (simple diamond) -->
  <g transform="translate(14,44)">
    <rect x="0" y="-5" width="10" height="10" rx="2" fill="#3572A5" opacity="0.9"/>
    <rect x="3" y="-2" width="4" height="4" rx="1" fill="#e6edf3" opacity="0.6"/>
  </g>
  <text x="32" y="48" font-family="'Segoe UI', 'SF Pro', system-ui, sans-serif" font-size="12" fill="#e6edf3">ragul_vl.py</text>
  <!-- Close icon on tab -->
  <text x="142" y="48" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#8b949e">×</text>

  <!-- Inactive tab -->
  <rect x="160" y="32" width="140" height="24" fill="#2d2d2d"/>
  <text x="180" y="48" font-family="'Segoe UI', 'SF Pro', system-ui, sans-serif" font-size="12" fill="#8b949e">README.md</text>

  <!-- Right side of tab bar (empty space) -->
  <rect x="300" y="32" width="600" height="24" fill="#252526"/>
</svg>
