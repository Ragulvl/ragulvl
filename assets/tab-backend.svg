<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="440" height="260" viewBox="0 0 440 260">
  <!-- Window frame -->
  <rect width="440" height="260" rx="10" fill="#1e1e2e"/>
  <rect width="440" height="34" rx="10" fill="#313244"/>
  <rect y="24" width="440" height="10" fill="#313244"/>
  <rect x="0.5" y="0.5" width="439" height="259" rx="10" fill="none" stroke="#45475a" stroke-width="1"/>

  <!-- Traffic lights -->
  <circle cx="18" cy="17" r="5" fill="#f38ba8"/>
  <circle cx="36" cy="17" r="5" fill="#f9e2af"/>
  <circle cx="54" cy="17" r="5" fill="#a6e3a1"/>

  <!-- Tab -->
  <rect x="72" y="4" width="160" height="24" rx="5" fill="#1e1e2e"/>
  <text x="86" y="20" font-family="'Fira Code', monospace" font-size="11" fill="#fab387">⚙</text>
  <text x="104" y="20" font-family="'Fira Code', monospace" font-size="11" fill="#a6adc8">backend.config</text>

  <!-- Line numbers gutter -->
  <rect x="0" y="34" width="40" height="206" fill="#313244" opacity="0.3"/>

  <g font-family="'Fira Code', 'Cascadia Code', monospace" font-size="13">
    <!-- Line numbers -->
    <g fill="#45475a">
      <text x="14" y="62" text-anchor="end">1</text>
      <text x="14" y="88" text-anchor="end">2</text>
      <text x="14" y="114" text-anchor="end">3</text>
      <text x="14" y="140" text-anchor="end">4</text>
      <text x="14" y="166" text-anchor="end">5</text>
      <text x="14" y="192" text-anchor="end">6</text>
    </g>

    <!-- Config content -->
    <text x="50" y="62" fill="#a6adc8"># Backend &amp; Databases</text>

    <text x="50" y="88">
      <tspan fill="#b4befe">runtime</tspan><tspan fill="#45475a">    = </tspan><tspan fill="#a6e3a1">Node.js</tspan>
    </text>
    <text x="50" y="114">
      <tspan fill="#b4befe">framework</tspan><tspan fill="#45475a">  = </tspan><tspan fill="#a6e3a1">Express.js</tspan>
    </text>
    <text x="50" y="140">
      <tspan fill="#b4befe">pattern</tspan><tspan fill="#45475a">    = </tspan><tspan fill="#a6e3a1">REST APIs</tspan>
    </text>
    <text x="50" y="166">
      <tspan fill="#b4befe">database</tspan><tspan fill="#45475a">   = </tspan><tspan fill="#a6e3a1">MySQL</tspan>
    </text>
    <text x="50" y="192">
      <tspan fill="#b4befe">cloud_db</tspan><tspan fill="#45475a">   = </tspan><tspan fill="#a6e3a1">NEON (PostgreSQL)</tspan>
    </text>
  </g>

  <!-- Status bar -->
  <rect y="240" width="440" height="20" fill="#313244"/>
  <text x="16" y="254" font-family="'Fira Code', monospace" font-size="10" fill="#89b4fa">TOML</text>
  <text x="390" y="254" font-family="'Fira Code', monospace" font-size="10" fill="#a6adc8">UTF-8</text>
</svg>
