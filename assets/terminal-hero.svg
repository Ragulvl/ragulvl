<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="310" viewBox="0 0 900 310">
  <defs>
    <style>
      @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    </style>
  </defs>

  <!-- Window frame -->
  <rect width="900" height="310" rx="10" fill="#1e1e2e"/>
  <rect width="900" height="38" rx="10" fill="#313244"/>
  <rect y="28" width="900" height="10" fill="#313244"/>
  <rect x="0.5" y="0.5" width="899" height="309" rx="10" fill="none" stroke="#45475a" stroke-width="1"/>

  <!-- Traffic lights -->
  <circle cx="22" cy="19" r="6" fill="#f38ba8"/>
  <circle cx="42" cy="19" r="6" fill="#f9e2af"/>
  <circle cx="62" cy="19" r="6" fill="#a6e3a1"/>

  <!-- Tab -->
  <rect x="85" y="6" width="180" height="26" rx="6" fill="#1e1e2e"/>
  <text x="102" y="24" font-family="'Fira Code', 'Cascadia Code', monospace" font-size="12" fill="#a6adc8">~/ragulvl — bash</text>

  <!-- Terminal content -->
  <g font-family="'Fira Code', 'Cascadia Code', monospace" font-size="14">
    <!-- Command 1 -->
    <text x="24" y="72" fill="#94e2d5">❯</text>
    <text x="44" y="72" fill="#cdd6f4">whoami</text>
    <text x="24" y="96" fill="#a6e3a1">Ragul V L</text>

    <!-- Command 2 -->
    <text x="24" y="130" fill="#94e2d5">❯</text>
    <text x="44" y="130" fill="#cdd6f4">cat role.txt</text>
    <text x="24" y="154" fill="#b4befe">AI &amp; Data Science Student</text>
    <text x="285" y="154" fill="#45475a">|</text>
    <text x="300" y="154" fill="#b4befe">Full-Stack Developer</text>

    <!-- Command 3 -->
    <text x="24" y="188" fill="#94e2d5">❯</text>
    <text x="44" y="188" fill="#cdd6f4">echo <tspan fill="#a6e3a1">"$MISSION"</tspan></text>
    <text x="24" y="212" fill="#a6adc8">Building scalable applications.</text>
    <text x="24" y="232" fill="#a6adc8">Designing intelligent systems.</text>
    <text x="24" y="252" fill="#a6adc8">Turning ideas into impactful products.</text>

    <!-- Status line -->
    <text x="24" y="286" fill="#94e2d5">❯</text>
    <text x="44" y="286" fill="#cdd6f4">echo <tspan fill="#a6e3a1">"$STATUS"</tspan></text>
    <text x="220" y="286" fill="#fab387">→ Founder of Dinez | Open to internships</text>

    <!-- Blinking cursor -->
    <rect x="620" y="274" width="9" height="16" fill="#cdd6f4" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0;0.8" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
