<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="110" viewBox="0 0 900 110">
  <rect width="900" height="110" rx="14" fill="#112240"/>
  <rect x="0.5" y="0.5" width="899" height="109" rx="14" fill="none" stroke="#233554" stroke-width="1"/>

  <!-- Title -->
  <text x="30" y="36" font-family="'Fira Code', monospace" font-size="12" fill="#64ffda">// Let's Connect</text>

  <!-- GitHub -->
  <g transform="translate(30, 54)">
    <rect width="200" height="36" rx="8" fill="none" stroke="#233554" stroke-width="1"/>
    <!-- Simple GitHub icon -->
    <circle cx="24" cy="18" r="8" fill="none" stroke="#ccd6f6" stroke-width="1.5"/>
    <circle cx="24" cy="15" r="3" fill="#ccd6f6"/>
    <text x="42" y="22" font-family="'Inter', system-ui, sans-serif" font-size="13" fill="#ccd6f6">github.com/Ragulvl</text>
  </g>

  <!-- LinkedIn -->
  <g transform="translate(250, 54)">
    <rect width="290" height="36" rx="8" fill="none" stroke="#233554" stroke-width="1"/>
    <!-- Simple LinkedIn icon -->
    <rect x="16" y="10" width="16" height="16" rx="3" fill="none" stroke="#0A66C2" stroke-width="1.5"/>
    <text x="20" y="23" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#0A66C2" font-weight="700">in</text>
    <text x="42" y="22" font-family="'Inter', system-ui, sans-serif" font-size="13" fill="#ccd6f6">linkedin.com/in/ragul-v-l-291143292</text>
  </g>

  <!-- Email -->
  <g transform="translate(560, 54)">
    <rect width="290" height="36" rx="8" fill="none" stroke="#233554" stroke-width="1"/>
    <!-- Simple email icon -->
    <rect x="16" y="12" width="16" height="12" rx="2" fill="none" stroke="#EA4335" stroke-width="1.5"/>
    <polyline points="16,12 24,20 32,12" fill="none" stroke="#EA4335" stroke-width="1.5"/>
    <text x="42" y="22" font-family="'Inter', system-ui, sans-serif" font-size="13" fill="#ccd6f6">ragulkamelash@gmail.com</text>
  </g>
