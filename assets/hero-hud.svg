<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340">
  <defs>
    <!-- Neon cyan glow -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#00f0ff" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Neon magenta glow -->
    <filter id="glowMag" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feFlood flood-color="#ff00aa" flood-opacity="0.5" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Grid pattern -->
    <pattern id="gridHero" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <!-- Scan line animation -->
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00f0ff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Base background -->
  <rect width="900" height="340" rx="12" fill="#0a0e1a"/>
  
  <!-- Grid overlay -->
  <rect width="900" height="340" rx="12" fill="url(#gridHero)" opacity="0.6"/>

  <!-- Outer frame border with neon cyan -->
  <rect x="1" y="1" width="898" height="338" rx="12" fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.4"/>
  <rect x="4" y="4" width="892" height="332" rx="10" fill="none" stroke="#00f0ff" stroke-width="0.5" opacity="0.2"/>

  <!-- Corner brackets (HUD targeting) -->
  <!-- Top-left -->
  <path d="M 16 30 L 16 16 L 30 16" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.8"/>
  <!-- Top-right -->
  <path d="M 870 16 L 884 16 L 884 30" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.8"/>
  <!-- Bottom-left -->
  <path d="M 16 310 L 16 324 L 30 324" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.8"/>
  <!-- Bottom-right -->
  <path d="M 884 310 L 884 324 L 870 324" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.8"/>

  <!-- Circuit trace decorations left side -->
  <path d="M 20 80 L 40 80 L 50 90 L 50 130 L 40 140 L 20 140" fill="none" stroke="#00f0ff" stroke-width="0.8" opacity="0.3"/>
  <circle cx="50" cy="110" r="2" fill="#00f0ff" opacity="0.5">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Circuit trace decorations right side -->
  <path d="M 880 80 L 860 80 L 850 90 L 850 130 L 860 140 L 880 140" fill="none" stroke="#00f0ff" stroke-width="0.8" opacity="0.3"/>
  <circle cx="850" cy="110" r="2" fill="#00f0ff" opacity="0.5">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" begin="1s"/>
  </circle>

  <!-- Top bar -->
  <rect x="16" y="16" width="868" height="28" rx="4" fill="#111827" opacity="0.8"/>
  <text x="32" y="35" font-family="'Fira Code','Cascadia Code',monospace" font-size="11" fill="#00f0ff" opacity="0.9">SYS://MISSION_CONTROL</text>
  
  <!-- Status indicators in top bar -->
  <circle cx="780" cy="30" r="3" fill="#39ff14">
    <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="790" y="34" font-family="'Fira Code',monospace" font-size="9" fill="#39ff14">ONLINE</text>
  <circle cx="840" cy="30" r="3" fill="#ffb800"/>
  <text x="850" y="34" font-family="'Fira Code',monospace" font-size="9" fill="#ffb800">SEC</text>

  <!-- SYSTEM ONLINE header -->
  <text x="450" y="82" text-anchor="middle" font-family="'Fira Code','Cascadia Code',monospace" font-size="10" fill="#00f0ff" letter-spacing="6" opacity="0.7">▸ SYSTEM INITIALIZED ◂</text>

  <!-- Main name display -->
  <text x="450" y="135" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="48" font-weight="800" fill="#e2e8f0" filter="url(#glowCyan)" letter-spacing="4">RAGUL V L</text>

  <!-- Decorative line under name -->
  <line x1="200" y1="152" x2="700" y2="152" stroke="#00f0ff" stroke-width="1" opacity="0.3"/>
  <line x1="350" y1="152" x2="550" y2="152" stroke="#00f0ff" stroke-width="2" opacity="0.6"/>
  
  <!-- Animated pulse on center line -->
  <circle cx="450" cy="152" r="3" fill="#00f0ff" opacity="0.8">
    <animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Role badges -->
  <rect x="200" y="168" width="220" height="26" rx="4" fill="#111827" stroke="#ff00aa" stroke-width="0.8" opacity="0.9"/>
  <text x="310" y="186" text-anchor="middle" font-family="'Fira Code',monospace" font-size="11" fill="#ff00aa" filter="url(#glowMag)">AI &amp; DATA SCIENCE STUDENT</text>

  <rect x="440" y="168" width="260" height="26" rx="4" fill="#111827" stroke="#00f0ff" stroke-width="0.8" opacity="0.9"/>
  <text x="570" y="186" text-anchor="middle" font-family="'Fira Code',monospace" font-size="11" fill="#00f0ff">FULL-STACK DEVELOPER</text>

  <!-- Mission telemetry readout -->
  <g font-family="'Fira Code','Cascadia Code',monospace" font-size="11">
    <text x="450" y="226" text-anchor="middle" fill="#64748b">MISSION_LOG:</text>
    <text x="450" y="248" text-anchor="middle" fill="#e2e8f0" opacity="0.9">Building scalable applications</text>
    <text x="450" y="268" text-anchor="middle" fill="#e2e8f0" opacity="0.7">Designing intelligent systems</text>
    <text x="450" y="288" text-anchor="middle" fill="#e2e8f0" opacity="0.5">Turning ideas into impactful products</text>
  </g>

  <!-- Bottom status module -->
  <rect x="250" y="302" width="400" height="22" rx="4" fill="#111827" stroke="#ffb800" stroke-width="0.5" opacity="0.7"/>
  <circle cx="268" cy="313" r="3" fill="#39ff14">
    <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
  </circle>
  <text x="280" y="317" font-family="'Fira Code',monospace" font-size="10" fill="#ffb800">STATUS: Founder of Dinez │ Open to internships</text>

  <!-- Mini radar in bottom-left corner -->
  <g transform="translate(60, 290)">
    <circle cx="0" cy="0" r="20" fill="none" stroke="#00f0ff" stroke-width="0.5" opacity="0.3"/>
    <circle cx="0" cy="0" r="12" fill="none" stroke="#00f0ff" stroke-width="0.3" opacity="0.2"/>
    <circle cx="0" cy="0" r="4" fill="none" stroke="#00f0ff" stroke-width="0.3" opacity="0.2"/>
    <line x1="-20" y1="0" x2="20" y2="0" stroke="#00f0ff" stroke-width="0.3" opacity="0.2"/>
    <line x1="0" y1="-20" x2="0" y2="20" stroke="#00f0ff" stroke-width="0.3" opacity="0.2"/>
    <!-- Sweep line -->
    <line x1="0" y1="0" x2="0" y2="-20" stroke="#00f0ff" stroke-width="1" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="4s" repeatCount="indefinite"/>
    </line>
    <!-- Blips -->
    <circle cx="8" cy="-6" r="1.5" fill="#39ff14" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-5" cy="10" r="1.5" fill="#ff00aa" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Scanning line animation overlay -->
  <rect x="4" y="0" width="892" height="8" rx="2" fill="url(#scanGrad)" opacity="0.5">
    <animate attributeName="y" values="-8;340" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
