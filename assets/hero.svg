<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280">
  <defs>
    <linearGradient id="topAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#64ffda"/>
      <stop offset="100%" stop-color="#64ffda" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#112240"/>
    </linearGradient>
  </defs>

  <!-- Card -->
  <rect width="900" height="280" rx="14" fill="url(#bgGrad)"/>
  <rect x="0.5" y="0.5" width="899" height="279" rx="14" fill="none" stroke="#233554" stroke-width="1"/>
  <!-- Top accent -->
  <rect width="200" height="3" rx="2" fill="url(#topAccent)" x="50" y="0"/>

  <!-- Dot grid (top-right decorative) -->
  <g fill="#233554" opacity="0.7">
    <circle cx="700" cy="35" r="1.2"/><circle cx="718" cy="35" r="1.2"/><circle cx="736" cy="35" r="1.2"/><circle cx="754" cy="35" r="1.2"/><circle cx="772" cy="35" r="1.2"/><circle cx="790" cy="35" r="1.2"/><circle cx="808" cy="35" r="1.2"/><circle cx="826" cy="35" r="1.2"/><circle cx="844" cy="35" r="1.2"/>
    <circle cx="700" cy="53" r="1.2"/><circle cx="718" cy="53" r="1.2"/><circle cx="736" cy="53" r="1.2"/><circle cx="754" cy="53" r="1.2"/><circle cx="772" cy="53" r="1.2"/><circle cx="790" cy="53" r="1.2"/><circle cx="808" cy="53" r="1.2"/><circle cx="826" cy="53" r="1.2"/><circle cx="844" cy="53" r="1.2"/>
    <circle cx="700" cy="71" r="1.2"/><circle cx="718" cy="71" r="1.2"/><circle cx="736" cy="71" r="1.2"/><circle cx="754" cy="71" r="1.2"/><circle cx="772" cy="71" r="1.2"/><circle cx="790" cy="71" r="1.2"/><circle cx="808" cy="71" r="1.2"/><circle cx="826" cy="71" r="1.2"/><circle cx="844" cy="71" r="1.2"/>
    <circle cx="700" cy="89" r="1.2"/><circle cx="718" cy="89" r="1.2"/><circle cx="736" cy="89" r="1.2"/><circle cx="754" cy="89" r="1.2"/><circle cx="772" cy="89" r="1.2"/><circle cx="790" cy="89" r="1.2"/><circle cx="808" cy="89" r="1.2"/><circle cx="826" cy="89" r="1.2"/><circle cx="844" cy="89" r="1.2"/>
    <circle cx="700" cy="107" r="1.2"/><circle cx="718" cy="107" r="1.2"/><circle cx="736" cy="107" r="1.2"/><circle cx="754" cy="107" r="1.2"/><circle cx="772" cy="107" r="1.2"/><circle cx="790" cy="107" r="1.2"/><circle cx="808" cy="107" r="1.2"/><circle cx="826" cy="107" r="1.2"/><circle cx="844" cy="107" r="1.2"/>
    <circle cx="700" cy="125" r="1.2"/><circle cx="718" cy="125" r="1.2"/><circle cx="736" cy="125" r="1.2"/><circle cx="754" cy="125" r="1.2"/><circle cx="772" cy="125" r="1.2"/><circle cx="790" cy="125" r="1.2"/><circle cx="808" cy="125" r="1.2"/><circle cx="826" cy="125" r="1.2"/><circle cx="844" cy="125" r="1.2"/>
  </g>

  <!-- Decorative </> (background) -->
  <text x="740" y="250" font-family="'Fira Code', monospace" font-size="120" fill="#112240" opacity="0.5" font-weight="700">&lt;/&gt;</text>

  <!-- Greeting -->
  <text x="50" y="60" font-family="'Fira Code', monospace" font-size="15" fill="#64ffda">Hi, my name is</text>

  <!-- Name -->
  <text x="50" y="115" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="56" fill="#ccd6f6" font-weight="800" letter-spacing="-2">Ragul V L</text>

  <!-- Role -->
  <text x="50" y="155" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="28" fill="#8892b0" font-weight="600">I build things for the web.</text>

  <!-- Tagline -->
  <text x="50" y="195" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#8892b0">AI &amp; Data Science Student · Full-Stack Developer · B.Tech</text>

  <!-- Status pill -->
  <rect x="50" y="220" width="310" height="32" rx="16" fill="none" stroke="#64ffda" stroke-width="1" opacity="0.5"/>
  <circle cx="70" cy="236" r="4" fill="#64ffda"/>
  <circle cx="70" cy="236" r="4" fill="#64ffda" opacity="0.3">
    <animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="84" y="240" font-family="'Fira Code', monospace" font-size="12" fill="#64ffda">Open to internships &amp; SDE roles</text>
</svg>
