  <rect x="0.5" y="0.5" width="899" height="359" rx="14" fill="none" stroke="#233554" stroke-width="1"/>
  <rect width="200" height="3" rx="2" fill="url(#topAccent)" x="50" y="0"/>

  <!-- Dot grid -->
  <g fill="#233554" opacity="0.7">
    <circle cx="720" cy="35" r="1.2"/><circle cx="738" cy="35" r="1.2"/><circle cx="756" cy="35" r="1.2"/><circle cx="774" cy="35" r="1.2"/><circle cx="792" cy="35" r="1.2"/><circle cx="810" cy="35" r="1.2"/><circle cx="828" cy="35" r="1.2"/><circle cx="846" cy="35" r="1.2"/>
    <circle cx="720" cy="53" r="1.2"/><circle cx="738" cy="53" r="1.2"/><circle cx="756" cy="53" r="1.2"/><circle cx="774" cy="53" r="1.2"/><circle cx="792" cy="53" r="1.2"/><circle cx="810" cy="53" r="1.2"/><circle cx="828" cy="53" r="1.2"/><circle cx="846" cy="53" r="1.2"/>
    <circle cx="720" cy="71" r="1.2"/><circle cx="738" cy="71" r="1.2"/><circle cx="756" cy="71" r="1.2"/><circle cx="774" cy="71" r="1.2"/><circle cx="792" cy="71" r="1.2"/><circle cx="810" cy="71" r="1.2"/><circle cx="828" cy="71" r="1.2"/><circle cx="846" cy="71" r="1.2"/>
    <circle cx="720" cy="89" r="1.2"/><circle cx="738" cy="89" r="1.2"/><circle cx="756" cy="89" r="1.2"/><circle cx="774" cy="89" r="1.2"/><circle cx="792" cy="89" r="1.2"/><circle cx="810" cy="89" r="1.2"/><circle cx="828" cy="89" r="1.2"/><circle cx="846" cy="89" r="1.2"/>
    <circle cx="720" cy="107" r="1.2"/><circle cx="738" cy="107" r="1.2"/><circle cx="756" cy="107" r="1.2"/><circle cx="774" cy="107" r="1.2"/><circle cx="792" cy="107" r="1.2"/><circle cx="810" cy="107" r="1.2"/><circle cx="828" cy="107" r="1.2"/><circle cx="846" cy="107" r="1.2"/>
  </g>

  <!-- Decorative </> -->
  <text x="700" y="320" font-family="'Fira Code', monospace" font-size="120" fill="#112240" opacity="0.5" font-weight="700">&lt;/&gt;</text>

  <!-- Emoji -->
  <text x="50" y="55" font-size="24">🚀</text>

  <!-- Name -->
  <text x="50" y="110" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="52" fill="#ccd6f6" font-weight="800" letter-spacing="-2">Ragul V L</text>

  <!-- Role -->
  <text x="50" y="145" font-family="'Fira Code', monospace" font-size="15" fill="#64ffda">AI &amp; Data Science Student  |  Full-Stack Developer</text>

  <!-- Tagline lines -->
  <text x="50" y="185" font-family="'Inter', system-ui, sans-serif" font-size="15" fill="#8892b0">Building scalable applications.</text>
  <text x="50" y="207" font-family="'Inter', system-ui, sans-serif" font-size="15" fill="#8892b0">Designing intelligent systems.</text>
  <text x="50" y="229" font-family="'Inter', system-ui, sans-serif" font-size="15" fill="#8892b0">Turning ideas into impactful products.</text>

  <!-- Accent bar -->
  <rect x="50" y="248" width="100" height="2" rx="1" fill="#233554"/>

  <!-- Founder line -->
  <text x="50" y="278" font-family="'Inter', system-ui, sans-serif" font-size="15" fill="#ccd6f6" font-weight="600">Founder of Dinez 🍽️</text>

  <!-- Passion line -->
  <text x="50" y="302" font-family="'Inter', system-ui, sans-serif" font-size="14" fill="#8892b0">Passionate about real-world problem solving.</text>

  <!-- Status pill -->
  <rect x="50" y="322" width="310" height="28" rx="14" fill="none" stroke="#64ffda" stroke-width="1" opacity="0.4"/>
  <circle cx="68" cy="336" r="4" fill="#64ffda"/>
  <circle cx="68" cy="336" r="4" fill="#64ffda" opacity="0.3">
    <animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="82" y="340" font-family="'Fira Code', monospace" font-size="11" fill="#64ffda">Open to internships &amp; SDE roles</text>
