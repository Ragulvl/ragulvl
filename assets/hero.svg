<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280">
  <defs>
    <linearGradient id="topLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#bc8cff"/>
      <stop offset="100%" stop-color="#f778ba"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e6edf3"/>
      <stop offset="100%" stop-color="#c9d1d9"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
  </defs>

  <!-- Card -->
  <rect width="900" height="280" rx="12" fill="url(#bgGrad)"/>
  <!-- Top gradient line -->
  <rect width="900" height="3" rx="12" fill="url(#topLine)"/>
  <!-- Border subtle -->
  <rect x="0.5" y="0.5" width="899" height="279" rx="12" fill="none" stroke="#21262d" stroke-width="1"/>

  <!-- Dot grid pattern (top-right) -->
  <g fill="#21262d" opacity="0.6">
    <circle cx="700" cy="30" r="1"/><circle cx="716" cy="30" r="1"/><circle cx="732" cy="30" r="1"/><circle cx="748" cy="30" r="1"/><circle cx="764" cy="30" r="1"/><circle cx="780" cy="30" r="1"/><circle cx="796" cy="30" r="1"/><circle cx="812" cy="30" r="1"/><circle cx="828" cy="30" r="1"/><circle cx="844" cy="30" r="1"/><circle cx="860" cy="30" r="1"/>
    <circle cx="700" cy="46" r="1"/><circle cx="716" cy="46" r="1"/><circle cx="732" cy="46" r="1"/><circle cx="748" cy="46" r="1"/><circle cx="764" cy="46" r="1"/><circle cx="780" cy="46" r="1"/><circle cx="796" cy="46" r="1"/><circle cx="812" cy="46" r="1"/><circle cx="828" cy="46" r="1"/><circle cx="844" cy="46" r="1"/><circle cx="860" cy="46" r="1"/>
    <circle cx="700" cy="62" r="1"/><circle cx="716" cy="62" r="1"/><circle cx="732" cy="62" r="1"/><circle cx="748" cy="62" r="1"/><circle cx="764" cy="62" r="1"/><circle cx="780" cy="62" r="1"/><circle cx="796" cy="62" r="1"/><circle cx="812" cy="62" r="1"/><circle cx="828" cy="62" r="1"/><circle cx="844" cy="62" r="1"/><circle cx="860" cy="62" r="1"/>
    <circle cx="700" cy="78" r="1"/><circle cx="716" cy="78" r="1"/><circle cx="732" cy="78" r="1"/><circle cx="748" cy="78" r="1"/><circle cx="764" cy="78" r="1"/><circle cx="780" cy="78" r="1"/><circle cx="796" cy="78" r="1"/><circle cx="812" cy="78" r="1"/><circle cx="828" cy="78" r="1"/><circle cx="844" cy="78" r="1"/><circle cx="860" cy="78" r="1"/>
    <circle cx="700" cy="94" r="1"/><circle cx="716" cy="94" r="1"/><circle cx="732" cy="94" r="1"/><circle cx="748" cy="94" r="1"/><circle cx="764" cy="94" r="1"/><circle cx="780" cy="94" r="1"/><circle cx="796" cy="94" r="1"/><circle cx="812" cy="94" r="1"/><circle cx="828" cy="94" r="1"/><circle cx="844" cy="94" r="1"/><circle cx="860" cy="94" r="1"/>
    <circle cx="700" cy="110" r="1"/><circle cx="716" cy="110" r="1"/><circle cx="732" cy="110" r="1"/><circle cx="748" cy="110" r="1"/><circle cx="764" cy="110" r="1"/><circle cx="780" cy="110" r="1"/><circle cx="796" cy="110" r="1"/><circle cx="812" cy="110" r="1"/><circle cx="828" cy="110" r="1"/><circle cx="844" cy="110" r="1"/><circle cx="860" cy="110" r="1"/>
    <circle cx="700" cy="126" r="1"/><circle cx="716" cy="126" r="1"/><circle cx="732" cy="126" r="1"/><circle cx="748" cy="126" r="1"/><circle cx="764" cy="126" r="1"/><circle cx="780" cy="126" r="1"/><circle cx="796" cy="126" r="1"/><circle cx="812" cy="126" r="1"/><circle cx="828" cy="126" r="1"/><circle cx="844" cy="126" r="1"/><circle cx="860" cy="126" r="1"/>
  </g>

  <!-- Decorative </> bracket (large, background) -->
  <text x="760" y="240" font-family="'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace" font-size="110" fill="#21262d" opacity="0.35" font-weight="700">&lt;/&gt;</text>

  <!-- Small decorative bracket (top-left) -->
  <text x="50" y="46" font-family="'Fira Code', monospace" font-size="13" fill="#30363d">/**</text>

  <!-- Name -->
  <text x="50" y="105" font-family="'Inter', 'Segoe UI', 'SF Pro Display', system-ui, -apple-system, sans-serif" font-size="52" fill="url(#nameGrad)" font-weight="800" letter-spacing="-1.5">Ragul V L</text>

  <!-- Role line -->
  <text x="50" y="140" font-family="'Fira Code', 'Cascadia Code', 'JetBrains Mono', 'Consolas', monospace" font-size="16" fill="#58a6ff" letter-spacing="0.5">AI &amp; Data Science Student · Full-Stack Developer</text>

  <!-- Description -->
  <text x="50" y="176" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="15" fill="#8b949e" letter-spacing="0.2">Building production-ready web applications and practical ML systems.</text>
  <text x="50" y="198" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="15" fill="#8b949e" letter-spacing="0.2">Passionate about clean architecture, scalable backends, and shipping code.</text>

  <!-- Close decorative comment -->
  <text x="50" y="218" font-family="'Fira Code', monospace" font-size="13" fill="#30363d">*/</text>

  <!-- Accent bar -->
  <rect x="50" y="235" width="140" height="3" rx="2" fill="url(#accentBar)"/>

  <!-- Status -->
  <circle cx="58" cy="260" r="5" fill="#3fb950"/>
  <circle cx="58" cy="260" r="5" fill="#3fb950" opacity="0.4">
    <animate attributeName="r" values="5;8;5" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="72" y="264" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#8b949e">Open to internships &amp; SDE opportunities</text>
</svg>
