<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
  <defs>
    <filter id="gCyan2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feFlood flood-color="#00f0ff" flood-opacity="0.5" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="gridAbout" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.5" fill="#1e293b"/>
    </pattern>
    <clipPath id="hexClip">
      <polygon points="80,10 130,35 130,85 80,110 30,85 30,35"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="900" height="300" rx="12" fill="#0a0e1a"/>
  <rect width="900" height="300" rx="12" fill="url(#gridAbout)" opacity="0.8"/>

  <!-- Border -->
  <rect x="1" y="1" width="898" height="298" rx="12" fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.3"/>

  <!-- Corner brackets -->
  <path d="M 16 28 L 16 16 L 28 16" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.7"/>
  <path d="M 872 16 L 884 16 L 884 28" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.7"/>
  <path d="M 16 272 L 16 284 L 28 284" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.7"/>
  <path d="M 884 272 L 884 284 L 872 284" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.7"/>

  <!-- Header bar -->
  <rect x="16" y="16" width="868" height="28" rx="4" fill="#111827" opacity="0.8"/>
  <text x="32" y="35" font-family="'Fira Code',monospace" font-size="11" fill="#00f0ff" opacity="0.9">DATA_CORE://CREW_MANIFEST</text>
  <text x="820" y="35" font-family="'Fira Code',monospace" font-size="9" fill="#39ff14">● ACTIVE</text>

  <!-- Hexagonal portrait frame -->
  <g transform="translate(40, 55)">
    <polygon points="80,5 135,35 135,95 80,125 25,95 25,35" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.6"/>
    <polygon points="80,12 128,38 128,92 80,118 32,92 32,38" fill="#111827" stroke="#1e293b" stroke-width="0.5"/>
    <!-- Initials inside hexagon -->
    <text x="80" y="72" text-anchor="middle" font-family="'Inter',system-ui,sans-serif" font-size="32" font-weight="800" fill="#00f0ff" filter="url(#gCyan2)" opacity="0.9">R</text>
    <text x="80" y="105" text-anchor="middle" font-family="'Fira Code',monospace" font-size="8" fill="#64748b">OPERATOR</text>
    <!-- Scan line over hexagon -->
    <line x1="25" y1="65" x2="135" y2="65" stroke="#00f0ff" stroke-width="0.8" opacity="0.3">
      <animate attributeName="y1" values="35;95;35" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="35;95;35" dur="3s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Data readout fields -->
  <g font-family="'Fira Code','Cascadia Code',monospace" transform="translate(220, 70)">
    <!-- DESIGNATION -->
    <text x="0" y="16" font-size="9" fill="#64748b" letter-spacing="2">DESIGNATION</text>
    <text x="0" y="36" font-size="15" fill="#e2e8f0" font-weight="600">Ragul V L</text>
    <line x1="0" y1="42" x2="300" y2="42" stroke="#1e293b" stroke-width="1"/>

    <!-- SPECIALIZATION -->
    <text x="0" y="66" font-size="9" fill="#64748b" letter-spacing="2">SPECIALIZATION</text>
    <text x="0" y="86" font-size="14" fill="#ff00aa">B.Tech in AI &amp; Data Science</text>
    <line x1="0" y1="92" x2="300" y2="92" stroke="#1e293b" stroke-width="1"/>

    <!-- MISSION DIRECTIVE -->
    <text x="0" y="116" font-size="9" fill="#64748b" letter-spacing="2">MISSION_DIRECTIVE</text>
    <text x="0" y="136" font-size="12" fill="#e2e8f0" opacity="0.9">Building scalable web applications</text>
    <text x="0" y="156" font-size="12" fill="#e2e8f0" opacity="0.7">Architecting AI-powered solutions</text>
    <text x="0" y="176" font-size="12" fill="#e2e8f0" opacity="0.5">Creating digital products with impact</text>

    <!-- FOCUS AREAS -->
    <text x="380" y="16" font-size="9" fill="#64748b" letter-spacing="2">FOCUS_AREAS</text>
    <!-- Tag boxes -->
    <rect x="380" y="24" width="110" height="22" rx="3" fill="#111827" stroke="#00f0ff" stroke-width="0.5"/>
    <text x="390" y="40" font-size="10" fill="#00f0ff">Full-stack dev</text>

    <rect x="380" y="52" width="140" height="22" rx="3" fill="#111827" stroke="#00f0ff" stroke-width="0.5"/>
    <text x="390" y="68" font-size="10" fill="#00f0ff">System architecture</text>

    <rect x="380" y="80" width="130" height="22" rx="3" fill="#111827" stroke="#00f0ff" stroke-width="0.5"/>
    <text x="390" y="96" font-size="10" fill="#00f0ff">Product building</text>

    <!-- BUILDS -->
    <text x="380" y="126" font-size="9" fill="#64748b" letter-spacing="2">BUILDS</text>
    <rect x="380" y="134" width="130" height="22" rx="3" fill="#111827" stroke="#ff00aa" stroke-width="0.5"/>
    <text x="390" y="150" font-size="10" fill="#ff00aa">Scalable web apps</text>

    <rect x="380" y="162" width="110" height="22" rx="3" fill="#111827" stroke="#ff00aa" stroke-width="0.5"/>
    <text x="390" y="178" font-size="10" fill="#ff00aa">AI solutions</text>
  </g>

  <!-- Animated data stream on right edge -->
  <g transform="translate(870, 60)" font-family="'Fira Code',monospace" font-size="8" fill="#1e293b" opacity="0.4">
    <text x="0" y="0">01</text><text x="0" y="12">10</text><text x="0" y="24">11</text>
    <text x="0" y="36">00</text><text x="0" y="48">01</text><text x="0" y="60">11</text>
    <text x="0" y="72">10</text><text x="0" y="84">01</text><text x="0" y="96">00</text>
    <text x="0" y="108">11</text><text x="0" y="120">10</text><text x="0" y="132">01</text>
    <text x="0" y="144">00</text><text x="0" y="156">11</text><text x="0" y="168">10</text>
    <text x="0" y="180">01</text><text x="0" y="192">11</text><text x="0" y="204">00</text>
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3s" repeatCount="indefinite"/>
  </g>

  <!-- Bottom info bar -->
  <rect x="16" y="268" width="868" height="20" rx="3" fill="#111827" opacity="0.6"/>
  <text x="32" y="282" font-family="'Fira Code',monospace" font-size="9" fill="#64748b">RECORD_ID: RVL-2024</text>
  <text x="750" y="282" font-family="'Fira Code',monospace" font-size="9" fill="#64748b">CLEARANCE: PUBLIC</text>
</svg>
