<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="120" viewBox="0 0 680 120" preserveAspectRatio="xMidYMid meet">
  <rect width="680" height="120" rx="8" fill="#0b1220"/>
  <g transform="translate(18,26)">
    <text x="0" y="18" font-family="Fira Code, monospace" font-size="16" fill="#cfeefe">$ git clone https://github.com/Ragulvl/dinez</text>
    <text id="line2" x="0" y="44" font-family="Fira Code, monospace" font-size="16" fill="#9fd6ff" opacity="0">$ cd dinez</text>
    <text id="line3" x="0" y="68" font-family="Fira Code, monospace" font-size="16" fill="#9fd6ff" opacity="0">$ npm run dev</text>

    <!-- fade in lines sequentially -->
    <animate href="#line2" attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.6s" fill="freeze"/>
    <animate href="#line3" attributeName="opacity" from="0" to="1" begin="2.4s" dur="0.6s" fill="freeze"/>

    <!-- blinking cursor -->
    <rect x="260" y="2" width="10" height="18" fill="#00D4FF" opacity="1">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
