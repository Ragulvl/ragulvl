<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">
  <!-- Editor card -->
  <rect width="900" height="200" rx="10" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="899" height="199" rx="10" fill="none" stroke="#21262d" stroke-width="1"/>

  <!-- Title bar -->
  <rect width="900" height="32" rx="10" fill="#161b22"/>
  <rect x="0" y="22" width="900" height="10" fill="#161b22"/>
  <!-- Dots -->
  <circle cx="18" cy="16" r="5" fill="#ff5f57"/>
  <circle cx="36" cy="16" r="5" fill="#febc2e"/>
  <circle cx="54" cy="16" r="5" fill="#28c840"/>
  <!-- File name -->
  <text x="80" y="20" font-family="'Fira Code', 'Cascadia Code', monospace" font-size="12" fill="#8b949e">currently_building.py</text>

  <!-- Gutter line -->
  <line x1="45" y1="32" x2="45" y2="200" stroke="#21262d" stroke-width="1"/>

  <!-- Line numbers -->
  <g font-family="'Fira Code', 'Cascadia Code', 'JetBrains Mono', 'Consolas', monospace" font-size="13" fill="#484f58" text-anchor="right">
    <text x="36" y="58">1</text>
    <text x="36" y="80">2</text>
    <text x="36" y="102">3</text>
    <text x="36" y="124">4</text>
    <text x="36" y="146">5</text>
    <text x="36" y="168">6</text>
    <text x="36" y="190">7</text>
  </g>

  <!-- Code -->
  <g font-family="'Fira Code', 'Cascadia Code', 'JetBrains Mono', 'Consolas', monospace" font-size="13">
    <!-- Line 1: comment -->
    <text x="58" y="58"><tspan fill="#484f58"># What I'm working on right now</tspan></text>

    <!-- Line 2: blank -->

    <!-- Line 3: projects = { -->
    <text x="58" y="102">
      <tspan fill="#e6edf3">projects </tspan><tspan fill="#d2a8ff">= </tspan><tspan fill="#e6edf3">{</tspan>
    </text>

    <!-- Line 4: Dinez -->
    <text x="58" y="124">
      <tspan fill="#e6edf3">    </tspan><tspan fill="#7ee787">"Dinez"</tspan><tspan fill="#e6edf3">:        </tspan><tspan fill="#7ee787">"Canteen ordering · React + Node + MySQL"</tspan><tspan fill="#e6edf3">,</tspan>
    </text>

    <!-- Line 5: Fusion Forge -->
    <text x="58" y="146">
      <tspan fill="#e6edf3">    </tspan><tspan fill="#7ee787">"Fusion Forge"</tspan><tspan fill="#e6edf3">: </tspan><tspan fill="#7ee787">"Custom PC e-commerce · React + Razorpay"</tspan>
    </text>

    <!-- Line 6: } -->
    <text x="58" y="168"><tspan fill="#e6edf3">}</tspan></text>

    <!-- Line 7: blank -->
  </g>
</svg>
