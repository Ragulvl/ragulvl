    <text x="100" y="80" fill="#cdd6f4">Ragulvl</text>

    <text x="20" y="100" fill="#a6adc8">Date:   </text>
    <text x="100" y="100" fill="#cdd6f4">2024</text>
  </g>

  <!-- Commit message -->
  <g font-family="'Inter', system-ui, sans-serif" font-size="13">
    <text x="40" y="132" fill="#cdd6f4" font-weight="600">🏸 Fusion Forge — Badminton E-commerce</text>

