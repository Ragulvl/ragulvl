  <rect width="440" height="34" rx="10" fill="#313244"/>
  <rect y="24" width="440" height="10" fill="#313244"/>
  <rect x="0.5" y="0.5" width="439" height="279" rx="10" fill="none" stroke="#45475a" stroke-width="1"/>

  <!-- Traffic lights -->
  <circle cx="18" cy="17" r="5" fill="#f38ba8"/>
  <circle cx="36" cy="17" r="5" fill="#f9e2af"/>
  <circle cx="54" cy="17" r="5" fill="#a6e3a1"/>

  <!-- Tab -->
