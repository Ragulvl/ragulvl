  <text x="16" y="274" font-family="'Fira Code', monospace" font-size="10" fill="#a6e3a1">● main</text>
  <text x="360" y="274" font-family="'Fira Code', monospace" font-size="10" fill="#a6adc8">+3 -0</text>
