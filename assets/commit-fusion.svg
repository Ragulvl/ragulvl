  <text x="86" y="20" font-family="'Fira Code', monospace" font-size="11" fill="#a6adc8">git log — fusion-forge</text>

  <!-- Git log content -->
  <g font-family="'Fira Code', 'Cascadia Code', monospace" font-size="12.5">
