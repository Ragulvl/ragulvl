<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
  <!-- Window frame -->
  <rect width="900" height="300" rx="10" fill="#1e1e2e"/>
  <rect width="900" height="38" rx="10" fill="#313244"/>
  <rect y="28" width="900" height="10" fill="#313244"/>
  <rect x="0.5" y="0.5" width="899" height="299" rx="10" fill="none" stroke="#45475a" stroke-width="1"/>

  <!-- Traffic lights -->
  <circle cx="22" cy="19" r="6" fill="#f38ba8"/>
  <circle cx="42" cy="19" r="6" fill="#f9e2af"/>
  <circle cx="62" cy="19" r="6" fill="#a6e3a1"/>

  <!-- Tab -->
  <rect x="85" y="6" width="220" height="26" rx="6" fill="#1e1e2e"/>
  <text x="102" y="24" font-family="'Fira Code', monospace" font-size="12" fill="#89b4fa">{ }</text>
  <text x="128" y="24" font-family="'Fira Code', monospace" font-size="12" fill="#a6adc8">profile.json</text>

  <!-- Line numbers gutter -->
  <rect x="0" y="38" width="48" height="262" fill="#313244" opacity="0.3"/>

  <!-- Content -->
  <g font-family="'Fira Code', 'Cascadia Code', monospace" font-size="13.5">
    <!-- Line numbers -->
    <g fill="#45475a">
      <text x="18" y="68" text-anchor="end">1</text>
      <text x="18" y="90" text-anchor="end">2</text>
      <text x="18" y="112" text-anchor="end">3</text>
      <text x="18" y="134" text-anchor="end">4</text>
      <text x="18" y="156" text-anchor="end">5</text>
      <text x="18" y="178" text-anchor="end">6</text>
      <text x="18" y="200" text-anchor="end">7</text>
      <text x="18" y="222" text-anchor="end">8</text>
      <text x="18" y="244" text-anchor="end">9</text>
      <text x="18" y="266" text-anchor="end">10</text>
      <text x="18" y="288" text-anchor="end">11</text>
    </g>

    <!-- JSON content -->
    <text x="60" y="68" fill="#cdd6f4">{</text>

    <text x="60" y="90">
      <tspan fill="#89b4fa">  "name"</tspan><tspan fill="#cdd6f4">: </tspan><tspan fill="#a6e3a1">"Ragul V L"</tspan><tspan fill="#cdd6f4">,</tspan>
    </text>

    <text x="60" y="112">
      <tspan fill="#89b4fa">  "education"</tspan><tspan fill="#cdd6f4">: </tspan><tspan fill="#a6e3a1">"B.Tech in AI &amp; Data Science"</tspan><tspan fill="#cdd6f4">,</tspan>
    </text>

    <text x="60" y="134">
      <tspan fill="#89b4fa">  "builds"</tspan><tspan fill="#cdd6f4">: [</tspan>
    </text>

    <text x="60" y="156">
      <tspan fill="#cdd6f4">    </tspan><tspan fill="#a6e3a1">"Scalable web apps"</tspan><tspan fill="#cdd6f4">, </tspan><tspan fill="#a6e3a1">"AI solutions"</tspan><tspan fill="#cdd6f4">, </tspan><tspan fill="#a6e3a1">"Digital products"</tspan>
    </text>

    <text x="60" y="178"><tspan fill="#cdd6f4">  ],</tspan></text>

    <text x="60" y="200">
      <tspan fill="#89b4fa">  "focus"</tspan><tspan fill="#cdd6f4">: [</tspan>
    </text>

    <text x="60" y="222">
      <tspan fill="#cdd6f4">    </tspan><tspan fill="#a6e3a1">"Full-stack dev"</tspan><tspan fill="#cdd6f4">, </tspan><tspan fill="#a6e3a1">"System architecture"</tspan><tspan fill="#cdd6f4">, </tspan><tspan fill="#a6e3a1">"Product building"</tspan>
    </text>

    <text x="60" y="244"><tspan fill="#cdd6f4">  ]</tspan></text>

    <text x="60" y="266" fill="#cdd6f4">}</text>
  </g>

  <!-- Status bar -->
  <rect x="0" y="280" width="900" height="20" rx="0" fill="#313244"/>
  <text x="16" y="294" font-family="'Fira Code', monospace" font-size="10" fill="#89b4fa">JSON</text>
  <text x="830" y="294" font-family="'Fira Code', monospace" font-size="10" fill="#a6adc8">UTF-8</text>
